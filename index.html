    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);

      const isHeader = (line) => {
        const low = line.toLowerCase();
        return low.includes("encouragement") || low.includes("valorisation")
          || low.includes("élève") || low.includes("eleve")
          || low.includes("élèves") || low.includes("eleves");
      };

      const dataLines = lines.filter(l => l.trim() && !isHeader(l));

      // Détecte le format selon l'en-tête
      const headerLine = lines.find(l => isHeader(l)) || "";
      const headerCols = headerLine.split(";").map(c => c.replace(/^"|"$/g, "").trim().toLowerCase());
      const hasSexCol = headerCols.some(c => c.includes("sexe") || c.includes("né"));
      const sexColIdx = headerCols.findIndex(c => c.includes("sexe") || c === "masculin" || c === "féminin");

      return dataLines.map((line) => {
        // Parse en respectant les guillemets
        const cols = [];
        let current = "";
        let inQuote = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') { inQuote = !inQuote; }
          else if ((ch === ';' || ch === ',') && !inQuote) { cols.push(current.trim()); current = ""; }
          else { current += ch; }
        }
        cols.push(current.trim());

        const clean = (s) => s.replace(/^"|"$/g, "").trim();

        let nom = "", prenom = "", genre = "F";
        const fullName = clean(cols[0]);

        // Sépare NOM PRÉNOM : mots tout en majuscules = nom de famille
        const parts = fullName.split(/\s+/);
        const nomParts = parts.filter(p => p === p.toUpperCase() && p.length > 1 && /[A-ZÀÂÄÉÈÊËÎÏÔÖÙÛÜÇ]/.test(p));
        const prenomParts = parts.filter(p => !(p === p.toUpperCase() && p.length > 1 && /[A-ZÀÂÄÉÈÊËÎÏÔÖÙÛÜÇ]/.test(p)));
        nom = nomParts.join(" ") || parts[0] || "";
        prenom = prenomParts.join(" ") || (parts.length > 1 ? parts.slice(1).join(" ") : "");

        // Sexe
        if (hasSexCol && sexColIdx >= 0 && cols[sexColIdx]) {
          const sexRaw = clean(cols[sexColIdx]).toLowerCase();
          genre = (sexRaw === "masculin" || sexRaw === "m") ? "M" : "F";
        } else if (cols.length >= 4 && (clean(cols[3]).toLowerCase() === "masculin" || clean(cols[3]).toLowerCase() === "féminin")) {
          genre = clean(cols[3]).toLowerCase() === "masculin" ? "M" : "F";
        }
        // Si pas de colonne sexe, reste à "F" par défaut (modifiable dans le tableau)

        return { id: genId(), nom, prenom, genre, niveau: null, particularites: "", absences: {} };
      }).filter(s => s.nom || s.prenom);
    }

    // ─── BANQUE D'ÉVALUATIONS ────────────────────────────────────────────────
    const BANQUE_EVALUATIONS = [
      {
        id: "biathlon_2nde",
        apsa: "Biathlon",
        niveau: "2nde",
        label: "Biathlon — 2nde",
        icon: "🏹",
        description: "Tir à l'arc · Course de fond",
        totalPts: 20,
        criteres: [
          { id: "perf", label: "Performance", max: 12 },
          { id: "reg",  label: "Régularité précision", max: 3 },
          { id: "prev", label: "Prévision", max: 2 },
          { id: "inv",  label: "Investissement", max: 3 },
        ],
        // Barème performance par genre (seuils en secondes)
        baremePerf: {
          F: [[7*60,12],[7*60+30,11],[8*60,10],[9*60,9],[10*60,8],[11*60,7],[12*60,6],[13*60,5],[14*60,4],[15*60,3],[16*60,2],[Infinity,1]],
          M: [[6*60,12],[6*60+30,11],[7*60,10],[8*60,9],[9*60,8],[10*60,7],[11*60,6],[12*60,5],[13*60,4],[14*60,3],[15*60,2],[Infinity,1]],
        },
        // Objectifs tir selon distance (4 volées)
        objectifsTir: { "6": 120, "7.5": 100, "9": 80 },
        penaliteParPt: 5, // secondes par point d'écart
        voleesCount: 4,
        flechesParVolee: 3,
        valeursFleches: ["", "0", "6", "7", "8", "9", "10"],
        distances: [
          { val: "6", label: "6 m (objectif 120 pts)" },
          { val: "7.5", label: "7m50 (objectif 100 pts)" },
          { val: "9", label: "9 m (objectif 80 pts)" },
        ],
        investissements: [
          { val: "0.5", label: "D1 — Aucun — 0,5 pt" },
          { val: "1",   label: "D2 — Limité — 1 pt" },
          { val: "2",   label: "D3 — Total mais peu qualitatif — 2 pts" },
          { val: "3",   label: "D4 — Sérieux & qualitatif — 3 pts" },
        ],
        calcul(eleve) {
          const timeToSec = (s) => {
            if (!s && s !== 0) return null;
            if (typeof s === "number") return s;
            s = String(s).replace(/"/g, "").trim();
            let m;
            if ((m = s.match(/^(\d+)[':'](\d+)$/))) return +m[1]*60 + +m[2];
            if ((m = s.match(/^(\d+)'(\d+)"?$/))) return +m[1]*60 + +m[2];
            const n = parseFloat(s);
            return isNaN(n) ? null : n;
          };
          const volees = (eleve.volees || [[], [], [], []]).slice(0, 4).map(v => {
            const arr = Array.isArray(v) ? v.slice(0, 3) : [String(v || ""), "", ""];
            while (arr.length < 3) arr.push("");
            return arr;
          });
          const totauxVolees = volees.map(fl => fl.reduce((s, f) => { const v = parseFloat(f); return s + (isNaN(v) ? 0 : v); }, 0));
          const totalTir = totauxVolees.reduce((a, b) => a + b, 0);
          const obj = _nullishCoalesce(this.objectifsTir[String(eleve.distance)], () => ( 100));
          const pen = (totalTir - obj) * this.penaliteParPt;
          const tc = timeToSec(eleve.tempsCourse);
          const tempsFinal = tc != null ? tc - pen : null;

          // Perf
          const seuils = this.baremePerf[eleve.genre === "M" ? "M" : "F"];
          let ptsPerf = 0;
          if (tempsFinal != null && !isNaN(tempsFinal)) {
            for (const [seuil, pts] of seuils) { if (tempsFinal <= seuil) { ptsPerf = pts; break; } }
          }
          // Régularité
          const sorted = [...totauxVolees].sort((a, b) => a - b);
          const ecart = sorted[3] - sorted[0];
          let ptsReg = 0.5;
          if (ecart < 4) ptsReg = 3;
          else if (ecart === 4) ptsReg = 2;
          else if (ecart <= 7) ptsReg = 1.5;
          else if (ecart <= 10) ptsReg = 1;
          // Prévision
          const prevSec = timeToSec(eleve.prevision);
          let ptsPrev = 0;
          if (prevSec != null && tc != null) {
            const d = Math.abs(prevSec - tc);
            if (d < 5) ptsPrev = 2;
            else if (d <= 14) ptsPrev = 1.5;
            else if (d <= 29) ptsPrev = 1;
            else ptsPrev = 0.5;
          }
          const ptsInv = parseFloat(eleve.investissement) || 0;
          const total = Math.round((ptsPerf + ptsReg + ptsPrev + ptsInv) * 2) / 2;
          return { ptsPerf, ptsReg, ptsPrev, ptsInv, total, pen, totalTir, totauxVolees, ecart, tempsFinal, tempsBrut: tc };
        },
      }
    ];

    // ─── HELPERS EVAL ────────────────────────────────────────────────────────
    function secToStr(s) {
      if (s == null || isNaN(s)) return "—";
      const neg = s < 0; s = Math.abs(Math.round(s));
      return (neg ? "-" : "") + Math.floor(s / 60) + "'" + String(s % 60).padStart(2, "0") + '"';
    }
    function ptColor(v, max) {
      const r = v / max;
      if (r >= 0.83) return "text-emerald-600";
      if (r >= 0.6)  return "text-amber-500";
      return "text-rose-500";
    }

      };

                )
                , React.createElement('div', { className: "flex gap-2 mt-5"  ,}
                  , React.createElement('button', { onClick: () => setShowModal(false), className: "flex-1 py-2 border border-gray-200 rounded-xl text-sm text-gray-600 hover:bg-gray-50 font-semibold"        ,}, "Annuler")
                  , React.createElement('button', { onClick: saveEleve, className: "flex-1 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold"       ,}
                    , editId ? "Enregistrer" : "Ajouter"
                  )
                )
              )
            )
          )
        )
      );
    }

    // ── Vue d'un sport (onglets Effectif / Appel / Équipes) ────────────────────
    function SportView({ sport, setSport }) {
      const [onglet, setOnglet] = useState("effectif");
      return (
        React.createElement('div', { className: "flex flex-col gap-4"  ,}
          , React.createElement('div', { className: "flex gap-1 bg-gray-100 rounded-xl p-1 w-fit"     ,}
            , [["effectif","👥 Effectif"],["appel","📋 Appel"],["equipes","🏆 Équipes"]].map(([v, label]) => (
              React.createElement('button', { key: v, onClick: () => setOnglet(v),
                className: `px-3 py-1.5 rounded-lg text-xs font-semibold transition ${onglet === v ? "bg-white text-indigo-600 shadow-sm" : "text-gray-500 hover:text-gray-700"}`,}
                , label
              )
            ))
          )
          , onglet === "effectif" && React.createElement(EffectifAS, { sport: sport, setSport: setSport,} )
          , onglet === "appel"    && React.createElement(AppelAS, { sport: sport, setSport: setSport,} )
          , onglet === "equipes"  && React.createElement(EquipesPanel, { sport: sport, setSport: setSport,} )
        )
      );
    }

    // ── Vue principale AS ──────────────────────────────────────────────────────
    function ASView({ onBack }) {
      const [sports, setSports] = useASPersist("sports", []);
      const [activeSportId, setActiveSportId] = useState(null);
      const [showAddSport, setShowAddSport] = useState(false);
      const [newSportNom, setNewSportNom] = useState("");
      const [confirmDelSport, setConfirmDelSport] = useState(null);

      const SPORT_ICONS = ["⚽","🏀","🏐","🎾","🏸","🏊","🏃","🚴","🤸","🥊","🤼","⛷️","🏋️","🎯","🏑"];

      const addSport = () => {
        const nom = newSportNom.trim();
        if (!nom) return;
        const id = genId();
        setSports(prev => [...prev, { id, nom, eleves: [], seances: [], equipes: [], icon: SPORT_ICONS[prev.length % SPORT_ICONS.length] }]);
        setActiveSportId(id);
        setNewSportNom("");
        setShowAddSport(false);
      };

      const deleteSport = (id) => {
        setSports(prev => prev.filter(s => s.id !== id));
        if (activeSportId === id) setActiveSportId(null);
        setConfirmDelSport(null);
      };

      const setSport = (id, fn) => setSports(prev => prev.map(s => s.id === id ? (typeof fn === "function" ? fn(s) : fn) : s));

      const activeSport = sports.find(s => s.id === activeSportId);

      return (
        React.createElement('div', { className: "min-h-screen bg-gradient-to-br from-slate-50 to-emerald-50/30"   ,}
          , React.createElement('header', { className: "bg-white border-b border-gray-100 shadow-sm sticky top-0 z-40"      ,}
            , React.createElement('div', { className: "max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center gap-3"       ,}
              , React.createElement('button', { onClick: onBack,
                className: "w-8 h-8 flex items-center justify-center rounded-xl hover:bg-gray-100 text-gray-500 hover:text-indigo-600 transition text-lg flex-shrink-0"           ,}, "←"

              )
              , React.createElement('div', { className: "w-8 h-8 bg-gradient-to-br from-emerald-500 to-emerald-700 rounded-xl flex items-center justify-center flex-shrink-0"         ,}
                , React.createElement('span', { className: "text-white text-sm" ,}, "🏅")
              )
              , React.createElement('div', null
                , React.createElement('h1', { className: "font-black text-gray-800 text-base leading-tight"   ,}, "Association Sportive" )
                , React.createElement('p', { className: "text-xs text-gray-400" ,}, sports.length, " sport" , sports.length > 1 ? "s" : "")
              )
            )
          )

          , React.createElement('div', { className: "max-w-7xl mx-auto px-4 sm:px-6 py-6 safe-bottom flex flex-col gap-5"        ,}
            /* Onglets sports */
            , React.createElement('div', { className: "flex items-center gap-2 flex-wrap"   ,}
              , sports.map(s => (
                React.createElement('div', { key: s.id, className: "relative group" ,}
                  , React.createElement('button', { onClick: () => setActiveSportId(s.id),
                    className: `flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold transition ${activeSportId === s.id ? "bg-emerald-600 text-white shadow-sm" : "bg-white border border-gray-100 text-gray-600 hover:border-emerald-200 hover:text-emerald-600 shadow-sm"}`,}
                    , React.createElement('span', null, s.icon), s.nom
                    , React.createElement('span', { className: `text-xs ${activeSportId === s.id ? "text-emerald-200" : "text-gray-400"}`,}
                      , (s.eleves||[]).length
                    )
                  )
                  , React.createElement('button', { onClick: () => setConfirmDelSport(s.id),
                    className: "absolute -top-1.5 -right-1.5 w-4 h-4 bg-rose-500 text-white rounded-full text-xs leading-none hidden group-hover:flex items-center justify-center shadow-sm"              ,}, "×"

                  )
                )
              ))
              , React.createElement('button', { onClick: () => setShowAddSport(true),
                className: "flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-semibold text-emerald-600 hover:bg-emerald-50 border border-dashed border-emerald-300 transition"             ,}, "+ Sport"

              )
            )

            /* Contenu du sport actif */
            , activeSport ? (
              React.createElement('div', { className: "bg-white rounded-2xl border border-gray-100 shadow-sm p-5"     ,}
                , React.createElement(SportView, { sport: activeSport, setSport: fn => setSport(activeSport.id, fn),} )
              )
            ) : (
              React.createElement('div', { className: "flex flex-col items-center justify-center py-24 gap-4 text-center"      ,}
                , React.createElement('div', { className: "w-20 h-20 bg-emerald-50 rounded-3xl flex items-center justify-center text-4xl"       ,}, "🏅")
                , React.createElement('div', null
                  , React.createElement('p', { className: "font-bold text-gray-700 text-lg"  ,}, "Association Sportive" )
                  , React.createElement('p', { className: "text-sm text-gray-400 mt-1"  ,}
                    , sports.length === 0 ? "Créez votre premier sport avec le bouton \"+ Sport\"" : "Sélectionnez un sport ci-dessus"
                  )
                )
              )
            )
          )

          /* Modal ajout sport */
          , showAddSport && (
            React.createElement('div', { className: "fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm"       ,}
              , React.createElement('div', { className: "bg-white rounded-2xl shadow-2xl p-6 w-[340px] max-w-[95vw]"     ,}
                , React.createElement('h3', { className: "font-bold text-gray-800 mb-4"  ,}, "Nouveau sport" )
                , React.createElement('input', { autoFocus: true, value: newSportNom, onChange: e => setNewSportNom(e.target.value),
                  onKeyDown: e => { if (e.key === "Enter") addSport(); if (e.key === "Escape") setShowAddSport(false); },
                  placeholder: "ex : Badminton, Football…"   ,
                  className: "w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-400 mb-4"         ,} )
                , React.createElement('div', { className: "flex gap-2" ,}
                  , React.createElement('button', { onClick: () => setShowAddSport(false), className: "flex-1 py-2 border border-gray-200 rounded-xl text-sm text-gray-600 hover:bg-gray-50 font-semibold"        ,}, "Annuler")
                  , React.createElement('button', { onClick: addSport, className: "flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-bold"       ,}, "Créer")
                )
              )
            )
          )

          /* Modal confirmation suppression sport */
          , confirmDelSport && (
            React.createElement('div', { className: "fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm"       ,}
              , React.createElement('div', { className: "bg-white rounded-2xl shadow-2xl p-6 w-[340px] max-w-[95vw]"     ,}
                , React.createElement('h3', { className: "font-bold text-gray-800 mb-2"  ,}, "Supprimer ce sport ?"   )
                , React.createElement('p', { className: "text-sm text-gray-500 mb-5"  ,}, "Tout l'effectif, les séances et les équipes seront supprimés."        )
                , React.createElement('div', { className: "flex gap-2" ,}
                  , React.createElement('button', { onClick: () => setConfirmDelSport(null), className: "flex-1 py-2 border border-gray-200 rounded-xl text-sm text-gray-600 font-semibold"       ,}, "Annuler")
                  , React.createElement('button', { onClick: () => deleteSport(confirmDelSport), className: "flex-1 py-2 bg-rose-600 text-white rounded-xl text-sm font-bold"      ,}, "Supprimer")
                )
              )
            )
          )
        )
      );
    }

    // ─── APP PRINCIPALE ───────────────────────────────────────────────────────
    function App() {
      const [classes, setClasses] = usePersist("classes", []);
      const [activeClasseId, setActiveClasseId] = useState(null);
      const [showAS, setShowAS] = useState(false);

      const activeClasse = classes.find(c => c.id === activeClasseId);

      if (showAS) return React.createElement(ASView, { onBack: () => setShowAS(false),} );

      if (activeClasse) {
        return (
          React.createElement(ClasseView, {
            classeId: activeClasse.id,
            classeLabel: activeClasse.label,
            onBack: () => setActiveClasseId(null),}
          )
        );
      }

      return React.createElement(ClasseSelector, { classes: classes, setClasses: setClasses, onSelect: setActiveClasseId, onOpenAS: () => setShowAS(true),} );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App, null ));
  
</script>
<!-- Service Worker Registration -->
<script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // PWA Install prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-banner').classList.add('show');
    });

    document.getElementById('install-btn')?.addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
          document.getElementById('install-banner').classList.remove('show');
        });
      }
    });

    document.getElementById('dismiss-btn')?.addEventListener('click', () => {
      document.getElementById('install-banner').classList.remove('show');
    });

    window.addEventListener('appinstalled', () => {
      document.getElementById('install-banner').classList.remove('show');
    });
</script>
</body>
</html>
